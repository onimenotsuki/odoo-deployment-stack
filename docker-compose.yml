services:
  odoo:
    image: odoo:17.0
    container_name: odoo
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - PORT=5432
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    restart: unless-stopped

  # OPCIONAL: Si quieres usar una nueva base de datos PostgreSQL en lugar de la existente,
  # descomenta esta sección y comenta la línea "HOST=host.docker.internal" arriba
  # y cambia "HOST=db" en su lugar
  db:
    image: postgres:15
    container_name: odoo_postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - odoo-db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  odoo-data:
  odoo-db:
